<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="t d">
<title id="t">See you around</title>
<desc id="d">Footer banner with a red sun and falling petals.</desc>
<style>

.fall{animation:fall var(--t) linear infinite;animation-delay:var(--dl)}
.sway{animation:sway var(--s) ease-in-out infinite alternate;animation-delay:var(--dl)}
.spin{transform-box:fill-box;transform-origin:center;animation:spin var(--r) linear infinite;animation-delay:var(--dl)}
@keyframes fall{0%{transform:translateY(-40px);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateY(var(--h));opacity:0}}
@keyframes sway{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@keyframes spin{0%{transform:rotate(0deg) scaleX(1)}50%{transform:rotate(180deg) scaleX(.35)}100%{transform:rotate(360deg) scaleX(1)}}

.sun{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

@media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
</style>

